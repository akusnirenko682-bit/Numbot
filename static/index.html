<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbers Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .balance-card h2 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .balance-card .amount {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .menu-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .menu-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-5px);
        }
        
        .menu-btn .icon {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .menu-btn .label {
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .shop-item {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .shop-item .number {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .shop-item .price {
            color: #ffd700;
            font-weight: bold;
        }
        
        .buy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .hidden {
            display: none;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <div id="main-screen">
        <div class="header">
            <h1>🚗 Numbers Bot</h1>
        </div>
        
        <div class="balance-card">
            <h2>💰 Твой баланс</h2>
            <div class="amount" id="balance">0 ₽</div>
        </div>
        
        <div class="menu-grid">
            <div class="menu-btn" onclick="showShop()">
                <div class="icon">🛒</div>
                <div class="label">Магазин</div>
            </div>
            <div class="menu-btn" onclick="showInventory()">
                <div class="icon">🎒</div>
                <div class="label">Инвентарь</div>
            </div>
            <div class="menu-btn" onclick="getBonus()">
                <div class="icon">🎁</div>
                <div class="label">Бонус</div>
            </div>
            <div class="menu-btn" onclick="showHelp()">
                <div class="icon">ℹ️</div>
                <div class="label">Помощь</div>
            </div>
        </div>
    </div>
    
    <div id="shop-screen" class="hidden">
        <button class="back-btn" onclick="showMain()">◀️ Назад</button>
        <h2 style="margin-bottom: 20px;">🛒 Магазин номеров</h2>
        <div id="shop-list"></div>
    </div>
    
    <div id="inventory-screen" class="hidden">
        <button class="back-btn" onclick="showMain()">◀️ Назад</button>
        <h2 style="margin-bottom: 20px;">🎒 Твой инвентарь</h2>
        <div id="inventory-list"></div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const userId = tg.initDataUnsafe?.user?.id;
        const username = tg.initDataUnsafe?.user?.username;
        
        async function loadData() {
            try {
                const response = await fetch(`/api/user/${userId}`);
                const data = await response.json();
                document.getElementById('balance').textContent = `${data.balance} ₽`;
            } catch (e) {
                console.error('Error loading data:', e);
            }
        }
        
        function showMain() {
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('shop-screen').classList.add('hidden');
            document.getElementById('inventory-screen').classList.add('hidden');
            loadData();
        }
        
        async function showShop() {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('shop-screen').classList.remove('hidden');
            
            try {
                const response = await fetch(`/api/shop/${userId}`);
                const items = await response.json();
                
                const list = document.getElementById('shop-list');
                list.innerHTML = '';
                
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'shop-item';
                    div.innerHTML = `
                        <div>
                            <div class="number">${item.number}</div>
                            <div style="font-size: 0.8em; opacity: 0.7;">${item.rarity}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="price">${item.price} ₽</div>
                            <button class="buy-btn" onclick="buyNumber(${item.id})">Купить</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error('Error loading shop:', e);
            }
        }
        
        async function buyNumber(itemId) {
            try {
                const response = await fetch(`/api/buy/${userId}/${itemId}`, { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    tg.showAlert(`✅ ${result.message}`);
                    showShop();
                } else {
                    tg.showAlert(`❌ ${result.message}`);
                }
            } catch (e) {
                console.error('Error buying:', e);
            }
        }
        
        async function showInventory() {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('inventory-screen').classList.remove('hidden');
            
            try {
                const response = await fetch(`/api/inventory/${userId}`);
                const items = await response.json();
                
                const list = document.getElementById('inventory-list');
                list.innerHTML = '';
                
                if (items.length === 0) {
                    list.innerHTML = '<p style="text-align: center; opacity: 0.7;">Инвентарь пуст</p>';
                    return;
                }
                
                items.forEach(item => {
                    const sellPrice = Math.floor(item.buy_price * 0.8);
                    const div = document.createElement('div');
                    div.className = 'shop-item';
                    div.innerHTML = `
                        <div>
                            <div class="number">${item.number}</div>
                            <div style="font-size: 0.8em; opacity: 0.7;">${item.rarity}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="price">${sellPrice} ₽</div>
                            <button class="buy-btn" style="background: #f44336;" onclick="sellNumber(${item.id})">Продать</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error('Error loading inventory:', e);
            }
        }
        
        async function sellNumber(itemId) {
            try {
                const response = await fetch(`/api/sell/${userId}/${itemId}`, { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    tg.showAlert(`✅ ${result.message}`);
                    showInventory();
                } else {
                    tg.showAlert(`❌ ${result.message}`);
                }
            } catch (e) {
                console.error('Error selling:', e);
            }
        }
        
        async function getBonus() {
            try {
                const response = await fetch(`/api/bonus/${userId}`, { method: 'POST' });
                const result = await response.json();
                tg.showAlert(`🎁 ${result.message}`);
                loadData();
            } catch (e) {
                console.error('Error getting bonus:', e);
            }
        }
        
        function showHelp() {
            tg.showAlert('ℹ️ Покупай номера в магазине, продавай их дороже, собирай коллекцию!');
        }
        
        // Загрузка данных при старте
        loadData();
    </script>
</body>
</html>
