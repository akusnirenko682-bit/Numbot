<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbers Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { 
            font-size: 2.2em; 
            background: linear-gradient(90deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }
        .balance-card h2 { font-size: 0.9em; opacity: 0.9; margin-bottom: 10px; }
        .balance-card .amount { font-size: 2.5em; font-weight: bold; }
        
        .section-title {
            font-size: 1.2em;
            margin: 25px 0 15px;
            padding-left: 10px;
            border-left: 4px solid #ffd700;
        }
        
        .countries-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .country-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .country-btn:active { transform: scale(0.95); }
        .country-btn .flag { font-size: 2.5em; margin-bottom: 8px; }
        .country-btn .name { font-size: 0.9em; font-weight: 600; }
        .country-btn .price { font-size: 0.75em; opacity: 0.7; margin-top: 5px; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .menu-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }
        .menu-btn .icon { font-size: 2em; margin-bottom: 8px; }
        .menu-btn .label { font-size: 0.9em; font-weight: 600; }
        
        .hidden { display: none; }
        .back-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 1em;
        }
        .item-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-card .number { font-weight: bold; font-size: 1.1em; }
        .item-card .country { font-size: 0.8em; opacity: 0.7; }
        .item-card .price { color: #ffd700; font-weight: bold; }
        .sell-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .rarity-Обычный { border-left: 4px solid #9e9e9e; }
        .rarity-Необычный { border-left: 4px solid #4CAF50; }
        .rarity-Редкий { border-left: 4px solid #2196F3; }
        .rarity-Эпический { border-left: 4px solid #9C27B0; }
        .rarity-Легендарный { border-left: 4px solid #FFD700; background: rgba(255, 215, 0, 0.1); }
    </style>
</head>
<body>
    <div id="main-screen">
        <div class="header">
            <h1>🚗 Numbers Bot</h1>
        </div>
        
        <div class="balance-card">
            <h2>💰 Твой баланс</h2>
            <div class="amount" id="balance">0 ₽</div>
        </div>
        
        <div class="section-title">🎯 Пункт выдачи</div>
        <div class="countries-grid">
            <div class="country-btn" onclick="issueNumber('ru')">
                <div class="flag">🇷🇺</div>
                <div class="name">Россия</div>
                <div class="price">500 ₽</div>
            </div>
            <div class="country-btn" onclick="issueNumber('by')">
                <div class="flag">🇧🇾</div>
                <div class="name">Беларусь</div>
                <div class="price">500 ₽</div>
            </div>
            <div class="country-btn" onclick="issueNumber('ua')">
                <div class="flag">🇺🇦</div>
                <div class="name">Украина</div>
                <div class="price">500 ₽</div>
            </div>
            <div class="country-btn" onclick="issueNumber('kz')">
                <div class="flag">🇰🇿</div>
                <div class="name">Казахстан</div>
                <div class="price">500 ₽</div>
            </div>
        </div>
        
        <div class="section-title">📋 Меню</div>
        <div class="menu-grid">
            <div class="menu-btn" onclick="showInventory()">
                <div class="icon">🎒</div>
                <div class="label">Инвентарь</div>
            </div>
            <div class="menu-btn" onclick="getBonus()">
                <div class="icon">🎁</div>
                <div class="label">Бонус</div>
            </div>
        </div>
    </div>
    
    <div id="inventory-screen" class="hidden">
        <button class="back-btn" onclick="showMain()">◀️ Назад</button>
        <h2 style="margin-bottom: 20px;">🎒 Твой инвентарь</h2>
        <div id="inventory-list"></div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id;
        
        async function loadData() {
            try {
                const response = await fetch(`/api/user/${userId}`);
                const data = await response.json();
                document.getElementById('balance').textContent = `${data.balance} ₽`;
            } catch (e) { console.error(e); }
        }
        
        function showMain() {
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('inventory-screen').classList.add('hidden');
            loadData();
        }
        
        async function issueNumber(country) {
            try {
                const response = await fetch(`/api/issue/${userId}/${country}`, { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    const flags = {'Россия': '🇷🇺', 'Беларусь': '🇧🇾', 'Украина': '🇺🇦', 'Казахстан': '🇰🇿'};
                    tg.showAlert(`🎉 Выбит номер!\n\n${flags[result.country] || ''} ${result.number}\nСтрана: ${result.country}\nРедкость: ${result.rarity}\nСтоимость: ${result.price}₽`);
                    loadData();
                } else {
                    tg.showAlert(`❌ ${result.message}`);
                }
            } catch (e) { console.error(e); }
        }
        
        async function showInventory() {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('inventory-screen').classList.remove('hidden');
            try {
                const response = await fetch(`/api/inventory/${userId}`);
                const items = await response.json();
                const list = document.getElementById('inventory-list');
                list.innerHTML = '';
                if (items.length === 0) {
                    list.innerHTML = '<p style="text-align: center; opacity: 0.7;">Инвентарь пуст. Выбери страну выше!</p>';
                    return;
                }
                const flags = {'Россия': '🇷🇺', 'Беларусь': '🇧🇾', 'Украина': '🇺🇦', 'Казахстан': '🇰🇿'};
                items.forEach(item => {
                    const sellPrice = Math.floor(item.buy_price * 0.8);
                    const div = document.createElement('div');
                    div.className = `item-card rarity-${item.rarity}`;
                    div.innerHTML = `
                        <div>
                            <div class="number">${flags[item.country] || ''} ${item.number}</div>
                            <div class="country">${item.country} • ${item.rarity}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="price">${sellPrice} ₽</div>
                            <button class="sell-btn" onclick="sellNumber(${item.id})">Продать</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }
        
        async function sellNumber(itemId) {
            try {
                const response = await fetch(`/api/sell/${userId}/${itemId}`, { method: 'POST' });
                const result = await response.json();
                tg.showAlert(`${result.success ? '✅' : '❌'} ${result.message}`);
                showInventory();
            } catch (e) { console.error(e); }
        }
        
        async function getBonus() {
            try {
                const response = await fetch(`/api/bonus/${userId}`, { method: 'POST' });
                const result = await response.json();
                tg.showAlert(`${result.success ? '🎁' : '⏰'} ${result.message}`);
                loadData();
            } catch (e) { console.error(e); }
        }
        
        loadData();
    </script>
</body>
</html>
